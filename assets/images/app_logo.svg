<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Dark Surface - Full Square Edge-to-Edge) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B26" />
      <stop offset="50%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>

    <!-- Glassmorphic Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.3" />
    </linearGradient>

    <!-- Main Flame Gradient (Solar Amber & Ember Red) -->
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Flow Ribbon Gradient (Cyber Violet to Neon Cyan) -->
    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="core-flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFF5F0" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>

    <!-- Checkmark Badge Fill Gradient (Emerald Green Completion) -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow Filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Ambient Glow behind logo elements -->
    <radialGradient id="ambient-glow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full Edge-to-Edge Solid Dark Square Background (No White Margins/Borders) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg-grad)" />

  <!-- Inner Subtle Accent Border -->
  <rect x="3" y="3" width="506" height="506" rx="96" fill="none" stroke="url(#border-grad)" stroke-width="4" opacity="0.6" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="265" r="180" fill="url(#ambient-glow)" />

  <!-- Background Orbit / Flow Line (Continuous Habit Flow) -->
  <path d="M 130 330 C 120 220, 200 130, 310 130 C 390 130, 410 200, 390 270 C 370 340, 300 390, 210 390" 
        fill="none" stroke="url(#flow-grad)" stroke-width="8" stroke-linecap="round" opacity="0.3" stroke-dasharray="12 10" />

  <!-- Outer Flowing Ribbon (Energetic S-Curve) -->
  <path d="M 140 350 
           C 120 260, 160 170, 235 140 
           C 295 115, 370 135, 390 200 
           C 410 265, 365 330, 305 355 
           C 240 380, 175 365, 145 415" 
        fill="none" stroke="url(#flow-grad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" opacity="0.85" />

  <!-- Main Flame Body (Loss Aversion / Streak Flame) -->
  <g filter="url(#soft-shadow)">
    <!-- Main Outer Flame Shell -->
    <path d="M 256 95 
             C 272 138, 298 165, 330 188 
             C 370 216, 388 260, 376 310 
             C 360 376, 304 416, 240 414 
             C 176 412, 124 364, 128 298 
             C 131 252, 158 216, 194 190 
             C 210 222, 226 232, 236 220 
             C 252 202, 236 156, 256 95 Z" 
          fill="url(#flame-grad)" />

    <!-- Secondary Accent Flame Flare -->
    <path d="M 282 148 
             C 296 178, 336 208, 346 248 
             C 356 288, 342 328, 312 353 
             C 342 328, 352 288, 336 248 
             C 326 218, 298 188, 282 148 Z" 
          fill="#FDE047" opacity="0.6" />

    <!-- Inner Core Flame (Spark of Consistency) -->
    <path d="M 256 205 
             C 270 240, 292 260, 292 292 
             C 292 332, 262 358, 226 348 
             C 205 342, 192 322, 195 296 
             C 198 266, 220 240, 236 230 
             C 243 246, 250 246, 256 205 Z" 
          fill="url(#core-flame)" />

    <!-- Bright White Central Light Tear -->
    <path d="M 250 255 
             C 260 275, 272 290, 270 310 
             C 268 330, 250 340, 235 335 
             C 225 331, 218 317, 220 303 
             C 222 283, 238 270, 250 255 Z" 
          fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Small Corner Checkmark Badge (Bottom Right Overlay) -->
  <g filter="url(#soft-shadow)">
    <!-- Badge Background Circle with Glowing White Outline -->
    <circle cx="348" cy="348" r="34" fill="url(#badge-grad)" stroke="#FFFFFF" stroke-width="3" filter="url(#glow)" />
    <!-- Small Crisp Checkmark -->
    <path d="M 331 348 L 343 360 L 365 336" 
          fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Floating Spark Particles / Consistency Stars -->
  <circle cx="348" cy="142" r="7" fill="#FDE047" filter="url(#glow)" />
  <circle cx="168" cy="168" r="5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="395" cy="275" r="5" fill="#C084FC" filter="url(#glow)" />
  <circle cx="138" cy="272" r="4" fill="#F59E0B" opacity="0.8" />
  <circle cx="295" cy="108" r="3" fill="#FFF5F0" />
</svg>
